name: Word data refresh proposal

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: word-data-refresh
  cancel-in-progress: false

jobs:
  propose:
    name: Validate and propose a pinned word-data revision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the exact upstream revision
        id: upstream
        shell: bash
        run: |
          revision="$(git ls-remote https://huggingface.co/datasets/ryanjosephkamp/english-openlist.git HEAD | cut -f1)"
          if [[ ! "$revision" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Hugging Face did not return an exact revision." >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "short=${revision:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build and validate the candidate authority
        run: |
          pnpm word-data:refresh -- --revision "${{ steps.upstream.outputs.revision }}"
          pnpm verify:word-assets

      - name: Stop when the deployed authority is already current
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/word-lists reports/word-refresh; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update the review branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.upstream.outputs.revision }}
          SHORT: ${{ steps.upstream.outputs.short }}
        shell: bash
        run: |
          existing="$(gh pr list --state open --json number,body --jq ".[] | select(.body | contains(\"${REVISION}\")) | .number" | head -1)"
          if [[ -n "$existing" ]]; then
            echo "An open review packet already covers ${REVISION}: PR #${existing}"
            exit 0
          fi
          branch="codex/word-data-refresh-${SHORT}-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/word-lists reports/word-refresh
          git commit -m "chore(words): propose upstream ${SHORT}"
          git push -u origin "$branch"
          body="Pinned English Open List revision: \`${REVISION}\`"$'\n\n'"Review the committed count, hash, and bounded-diff report. This workflow never auto-merges or deploys Production."
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "chore(words): propose upstream ${SHORT}" \
            --body "$body"
